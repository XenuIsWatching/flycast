# Build the retroXR flycast core for Windows and Android and publish it as a
# release, so retroXR's CoreDownloadManager can fetch it.
#
# This fork exports flycast_get_vmu_screen, which hands a VMU's 48 x 32 LCD to
# the frontend instead of compositing it into the finished frame. Stock flycast
# has no second video output, so the only way it can show a VMU screen is to
# draw it over the game at a corner the player picks -- and a frontend that
# wants that screen somewhere of its own (a model of the card in a VR room, a
# second window, a phone) has to crop it back out, losing the game's pixels
# underneath it for good. The data was always maintained whether or not an
# overlay was drawn; there was simply no way to ask for it.
#
#   Windows  flycast_libretro.dll.zip          containing flycast_libretro.dll
#   Android  flycast_libretro_android.so.zip   containing flycast_libretro_android.so
#
# flycast is CMake-only -- there is no libretro/Makefile as in snes9x or mGBA --
# so both jobs configure and build rather than calling make with a platform. The
# Windows recipe is lifted from this repo's own c-cpp.yml, which builds
# libretro-x86_64-w64-mingw32 under msys2 rather than with MSVC.
#
# The release must NOT be a prerelease: the download URL is the /releases/latest/
# form so shipping a build needs no app update, and GitHub's `latest` skips
# prereleases. Anything else cut on this fork should be marked prerelease.
name: retroXR core release

on:
  push:
    tags:
      - 'retroxr-flycast-libretro-v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to build'
        required: true
        default: 'retroxr'
      tag:
        description: 'Release tag to publish as (leave blank to build without publishing)'
        required: false
        default: ''

jobs:
  windows:
    name: Windows x86_64 (mingw-w64)
    runs-on: windows-2022
    defaults:
      run:
        shell: 'msys2 {0}'
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: git make zip mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja mingw-w64-x86_64-toolchain mingw-w64-x86_64-SDL2 mingw-w64-x86_64-libcdio

      # Submodules are not optional: the libretro target pulls libchdr, xbyak,
      # glslang, VulkanMemoryAllocator and more out of core/deps.
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Build
        run: |
          cmake -B build -G Ninja -DLIBRETRO=ON -DUSE_LIBCDIO=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j $(nproc)

      - name: Package
        run: |
          mapfile -t hits < <(find build -maxdepth 2 -name 'flycast_libretro.dll' -type f)
          if [ "${#hits[@]}" -ne 1 ]; then
            echo "expected exactly one flycast_libretro.dll, found ${#hits[@]}:"
            printf '  %s\n' "${hits[@]}"
            exit 1
          fi
          # The export this whole fork exists for. A build that silently lost it
          # would install cleanly and fall back to the overlay, which is the very
          # bug it was forked to fix -- so it is checked here rather than
          # discovered in a headset.
          if ! strings "${hits[0]}" | grep -q flycast_get_vmu_screen; then
            echo "built dll does not export flycast_get_vmu_screen"
            exit 1
          fi
          mkdir -p stage
          cp "${hits[0]}" stage/flycast_libretro.dll
          (cd stage && zip -q -X ../flycast_libretro.dll.zip flycast_libretro.dll)
          ls -lh flycast_libretro.dll.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: flycast_libretro.dll.zip
          if-no-files-found: error

  android:
    name: Android arm64-v8a
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip zip ninja-build
          # Into RUNNER_TEMP, NOT the workspace: this step runs before
          # actions/checkout, and checkout clears the workspace it checks into.
          wget -q -O "$RUNNER_TEMP/ndk.zip" https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"
          echo "NDK_ROOT=$RUNNER_TEMP/android-ndk-r27d" >> $GITHUB_ENV

      - uses: actions/checkout@v6
        with:
          submodules: recursive
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Build
        run: |
          cmake -B build -G Ninja -DLIBRETRO=ON -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24
          cmake --build build -j $(nproc)

      # CMake names it flycast_libretro.so on every platform; retroXR installs
      # Android cores under the buildbot's _android suffix, so it is renamed on
      # the way into the zip rather than at install time.
      - name: Package
        run: |
          mapfile -t hits < <(find build -maxdepth 2 -name 'flycast_libretro.so' -type f)
          if [ "${#hits[@]}" -ne 1 ]; then
            echo "expected exactly one flycast_libretro.so, found ${#hits[@]}:"
            printf '  %s\n' "${hits[@]}"
            exit 1
          fi
          NM="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          if ! "$NM" -D --defined-only "${hits[0]}" | grep -q flycast_get_vmu_screen; then
            echo "built so does not export flycast_get_vmu_screen"
            exit 1
          fi
          mkdir -p stage
          cp "${hits[0]}" stage/flycast_libretro_android.so
          (cd stage && zip -q -X ../flycast_libretro_android.so.zip flycast_libretro_android.so)
          ls -lh flycast_libretro_android.so.zip

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: flycast_libretro_android.so.zip
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [windows, android]
    if: github.event_name == 'push' || github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          ls -lh dist
          cat > notes.md <<'NOTES'
          flycast libretro core built for retroXR.

          Windows x86_64 and Android arm64-v8a. The source for these binaries is
          this tag. flycast is GPLv2.

          Over the stock buildbot build this exports one function:

              bool flycast_get_vmu_screen(unsigned vmu, u32 *pixels,
                                          size_t count, u64 *changed)

          It hands a VMU's 48 x 32 LCD over directly, so a frontend can show that
          screen wherever it likes without the core drawing it into the picture.
          Stock flycast has no second video output and can only composite the
          panel into the finished frame at a corner, which means cropping it back
          out and losing the game's pixels underneath it for good. The data was
          already maintained whether or not an overlay was drawn, so this adds no
          emulation work at all -- only a way to ask for it.
          NOTES
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "flycast (retroXR build) $TAG" \
              --notes-file notes.md
          fi
          gh release upload "$TAG" \
            dist/flycast_libretro.dll.zip \
            dist/flycast_libretro_android.so.zip \
            --repo "$GITHUB_REPOSITORY" --clobber
